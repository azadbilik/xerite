<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ədəbiyyat xəritəsi · Azad Bilik</title>
<meta name="description" content="Azərbaycan yazıçı və şairlərinin doğulduğu və vəfat etdiyi yerlər. Where Azerbaijani writers and poets were born and died.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Ədəbiyyat xəritəsi · Literary map">
<meta property="og:description" content="Azərbaycan yazıçı və şairlərinin doğulduğu və vəfat etdiyi yerlər.">
<meta property="og:image" content="https://azadbilik.org/xerite/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --paper: #F4EFE6; --ink: #1A1410; --muted: #675E55; --rule: rgb(26 20 16 / .14);
    --accent: #A81E28; --panel: rgb(244 239 230 / .96); --water: #E4DCCF; --land: #F4EFE6;
    --serif: 'Literata', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #14100D; --ink: #F1EBE1; --muted: #A0968B; --rule: rgb(241 235 225 / .14);
      --accent: #DA5A61; --panel: rgb(20 16 13 / .95); --water: #0C0A08; --land: #1C1713; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 .9375rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1px; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: currentColor; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .langs { display: inline-flex; gap: .15rem; margin-left: .25rem; }
  .langs button { font-size: .6875rem; letter-spacing: .04em; padding: .1rem .3rem; border-radius: 2px; color: var(--muted); }
  .langs button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -1px currentColor; }

  #map { position: fixed; inset: 0; background: var(--water); }

  .panel {
    position: fixed; top: 1rem; left: 1rem; bottom: 1rem; width: 23rem;
    display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 32px rgb(0 0 0 / .06);
  }
  .head { padding: 1.25rem 1.5rem 1rem; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .top nav { display: flex; gap: 1rem; font-size: .8125rem; color: var(--muted); }
  .brand { white-space: nowrap; display: inline-flex; align-items: center; gap: .5rem; font-size: .8125rem; font-weight: 600; text-decoration: none; }
  .brand svg { width: 1rem; height: 1rem; }
  .star { fill: currentColor; } .gem { fill: var(--accent); }
  h1 { margin-top: 1.25rem; font: 400 1.875rem/1.1 var(--serif); letter-spacing: -.02em; }
  .sub { margin-top: .35rem; font: italic 300 1rem/1.35 var(--serif); }

  .controls { padding: 0 1.5rem 1rem; display: grid; gap: 1rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); border-radius: 3px; padding: 2px; }
  .seg button { padding: .4rem .5rem; border-radius: 2px; font-size: .8125rem; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .hist-label { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .hist-label button { font-size: .75rem; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: .2em; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 3.25rem; margin-top: .5rem; }
  .hist button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 0; }
  .hist .bar { display: block; background: var(--ink); opacity: .22; min-height: 2px; transition: opacity .15s; }
  .hist button:hover .bar { opacity: .5; }
  .hist button[aria-pressed="true"] .bar { background: var(--accent); opacity: 1; }
  .hist-axis { display: flex; gap: 2px; margin-top: .3rem; }
  .hist-axis span { flex: 1; text-align: center; font-size: .625rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .list { flex: 1; overflow-y: auto; border-top: 1px solid var(--rule); padding: .75rem 0 1rem; overscroll-behavior: contain; }
  .list h2 { padding: .25rem 1.5rem .5rem; font: 400 1.25rem/1.2 var(--serif); letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .list h2 small { font: 400 .75rem var(--sans); color: var(--muted); white-space: nowrap; }
  .list ol { list-style: none; padding: 0; }
  .list li a, .list li button { display: grid; grid-template-columns: 1fr auto; gap: .1rem 1rem; width: 100%; text-align: left; padding: .45rem 1.5rem; text-decoration: none; }
  .list li a:hover, .list li button:hover { background: var(--rule); }
  .list .name { font-weight: 500; }
  .list li.focus button { background: var(--rule); box-shadow: inset 2px 0 var(--accent); }

  .card .maplibregl-popup-content { padding: .85rem 2rem .9rem 1rem; border: 1px solid var(--rule); border-radius: 4px; }
  .card .maplibregl-popup-close-button { font-size: 1.1rem; width: 1.75rem; height: 1.75rem; color: var(--muted); }
  .card .maplibregl-popup-close-button:hover { background: none; color: var(--ink); }
  .card-name { font: 400 1.125rem/1.2 var(--serif); letter-spacing: -.01em; }
  .card-years { margin-top: .15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-places { list-style: none; padding: 0; margin-top: .5rem; display: grid; gap: .1rem; }
  .card-places small { color: var(--muted); font-size: .75rem; }
  .card-link { display: block; margin-top: .65rem; padding-top: .55rem; border-top: 1px solid var(--rule); font-weight: 500; text-decoration: none; }
  .card-link:hover { color: var(--accent); }
  .list .meta { grid-column: 1; font-size: .8125rem; color: var(--muted); }
  .list .num { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .back { margin: 0 1.5rem .5rem; font-size: .8125rem; color: var(--muted); }
  .note { padding: 1rem 1.5rem 0; font-size: .75rem; color: var(--muted); }

  .maplibregl-ctrl-attrib { font: .6875rem var(--sans); background: var(--panel) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted); }
  .maplibregl-ctrl-group { background: var(--panel); border: 1px solid var(--rule); box-shadow: none !important; }
  .maplibregl-ctrl-group button + button { border-top-color: var(--rule); }
  @media (prefers-color-scheme: dark) { .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); } }
  .maplibregl-popup-content { background: var(--paper); color: var(--ink); font: .8125rem var(--sans); padding: .4rem .6rem; border-radius: 3px; box-shadow: 0 2px 12px rgb(0 0 0 / .15); }
  .maplibregl-popup-tip { display: none; }

  @media (max-width: 48rem) {
    .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 52svh; border-radius: 12px 12px 0 0; border-bottom: 0; }
    .head { padding: 1rem 1rem .75rem; }
    h1 { margin-top: .75rem; font-size: 1.5rem; }
    .controls { padding: 0 1rem .75rem; }
    .list h2, .list li a, .list li button { padding-inline: 1rem; }
    .back, .note { margin-inline: 1rem; padding-inline: 0; }
    .panel { overflow-y: auto; overscroll-behavior: contain; }
    .list { flex: none; overflow: visible; }
    .sub { display: none; }
    .hist { height: 2.25rem; }
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: 52svh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" role="region" data-i18n-label="map"></div>

<aside class="panel">
  <div class="head">
    <div class="top"><a class="brand" href="/"><svg viewBox="0 0 512 512" aria-hidden="true"><g class="star"><rect x="126" y="126" width="260" height="260"/><polygon points="256,72 440,256 256,440 72,256"/></g><polygon class="gem" points="256,196 316,256 256,316 196,256"/></svg>Azad Bilik</a><nav><a href="/qalereya/" data-i18n="gallery" data-lang-href>Qalereya</a><a href="https://kitabxana.az" data-i18n="library" id="kx">Kitabxana</a><span class="langs" role="group" aria-label="Dil · Язык · Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></span></nav></div>
    <h1 data-i18n="title">Ədəbiyyat xəritəsi</h1>
    <p class="sub" data-i18n="sub">Azərbaycan yazıçılarının doğulduğu və vəfat etdiyi yerlər</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" data-i18n-label="place">
      <button type="button" data-mode="birth" aria-pressed="true" data-i18n="born">Doğulduğu yer</button>
      <button type="button" data-mode="death" aria-pressed="false" data-i18n="died">Vəfat etdiyi yer</button>
    </div>
    <div>
      <div class="hist-label"><span data-i18n="century">Əsr</span><button type="button" id="all" hidden data-i18n="all">Hamısı</button></div>
      <div class="hist" id="hist"></div>
      <div class="hist-axis" id="axis"></div>
    </div>
  </div>
  <div class="list" id="list" aria-live="polite"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const roman = (n) => [['XX', 20], ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]].reduce((s, [r, v]) => { while (n >= v) { s += r; n -= v; } return s; }, '');
const fromRoman = (s) => { const v = { I: 1, V: 5, X: 10 }; return [...s].reduce((n, c, i, a) => v[c] < (v[a[i + 1]] ?? 0) ? n - v[c] : n + v[c], 0); };
const centuryOf = (a) => {
  const y = a.born ?? (a.died != null ? a.died - 40 : null);
  if (y != null) return Math.floor((y - 1) / 100) + 1;
  const m = a.period?.match(/\b[IVX]+\b/);
  return m ? fromRoman(m[0]) : null;
};
// One language at a time: ?lang=, else the visitor's last choice on azadbilik.org, else Azerbaijani
const LANGS = ['az', 'ru', 'en'];
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
  return 'az';
})();
const T = {
  az: { doc: 'Ədəbiyyat xəritəsi · Azad Bilik', title: 'Ədəbiyyat xəritəsi', sub: 'Azərbaycan yazıçılarının doğulduğu və vəfat etdiyi yerlər', map: 'Xəritə', place: 'Yer', born: 'Doğulduğu yer', died: 'Vəfat etdiyi yer', century: 'Əsr', all: 'Hamısı', gallery: 'Qalereya', library: 'Kitabxana', allPlaces: 'Bütün yerlər',
    cent: (c) => `${roman(c)} əsr`, authors: (n) => `${n} müəllif`, places: (n) => `${n} yer`, works: (n) => `${n} əsər kitabxana.az-da`,
    origin: { name: 'adından', mumtaz: 'S. Mümtaza görə', source: 'əslən buradan' }, wrong: 'Səhv tapdınız?',
    note: (n, t) => `${n} müəllif, saytdakı ${t} müəllifdən. Yerlər Wikidata-dandır; doğulduğu yeri bilinməyən el şairlərinin bir qismi gəldiyi yerdə göstərilir: adından (Şəkili, Dərbəndli) və ya Salman Mümtazın «El şairləri»ndəki qeydinə görə. Yalnız ləqəbi ilə tanınanların çoxunun yeri məlum deyil.` },
  ru: { doc: 'Литературная карта · Azad Bilik', title: 'Литературная карта', sub: 'Где родились и умерли азербайджанские писатели', map: 'Карта', place: 'Место', born: 'Место рождения', died: 'Место смерти', century: 'Век', all: 'Все', gallery: 'Галерея', library: 'Библиотека', allPlaces: 'Все места',
    cent: (c) => `${roman(c)} век`, authors: (n) => `${n} ${plural(n, 'автор', 'автора', 'авторов')}`, places: (n) => `${n} ${plural(n, 'место', 'места', 'мест')}`, works: (n) => `${n} ${plural(n, 'произведение', 'произведения', 'произведений')} на kitabxana.az`,
    origin: { name: 'по имени', mumtaz: 'по С. Мумтазу', source: 'родом отсюда' }, wrong: 'Нашли ошибку?',
    note: (n, t) => `${n} из ${t} авторов сайта. Места взяты из Викиданных; часть народных поэтов, чьё место рождения неизвестно, показана там, откуда они родом: по имени (Шекили — «из Шеки») или по заметке Салмана Мумтаза в «Эл шаирлери». У большинства известных лишь по прозвищу место неизвестно.` },
  en: { doc: 'Literary map · Azad Bilik', title: 'Literary map', sub: 'Where Azerbaijani writers were born and died', map: 'Map', place: 'Place', born: 'Born', died: 'Died', century: 'Century', all: 'All', gallery: 'Gallery', library: 'Library', allPlaces: 'All places',
    cent: (c) => `${c}${[, 'st', 'nd', 'rd'][c % 10 * (c % 100 > 3 && c % 100 < 21 ? 0 : 1)] ?? 'th'} century`, authors: (n) => `${n} author${n === 1 ? '' : 's'}`, places: (n) => `${n} place${n === 1 ? '' : 's'}`, works: (n) => `${n} work${n === 1 ? '' : 's'} on kitabxana.az`,
    origin: { name: 'by name', mumtaz: 'per S. Mümtaz', source: 'family origin' }, wrong: 'Found a mistake?',
    note: (n, t) => `${n} of the site's ${t} authors. Places are from Wikidata; folk poets with no recorded birthplace are shown where they came from, by their name (Şəkili, “of Shaki”) or Salman Mümtaz's note in «El şairləri». Most of those known by a single name have no known place.` },
};
const t = (k) => T[lang][k];
function plural(n, one, few, many) { const r = new Intl.PluralRules('ru').select(n); return r === 'one' ? one : r === 'few' ? few : many; }
const kitabxana = (path = '') => `https://kitabxana.az${lang === 'az' ? '' : '/' + lang}${path}`;
const label = (p) => p[lang] || p.az || p.en || p.ru;
const nameOf = (a) => a[lang] || a.az;
const years = (a) => a.born || a.died ? `${a.born ?? '?'}–${a.died ?? ''}` : (a.period ?? '');
// A folk poet placed by where they came from, not by a recorded birthplace
const origin = (a) => t('origin')[a.birth?.from] ?? '';
const meta = (...xs) => xs.filter(Boolean).join(' · ');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const TOTAL = 472;
let authors = [], mode = 'birth', century = null, place = null;
// ?author=<slug> (linked from kitabxana.az): open on that author's place, their name marked
let focus = new URLSearchParams(location.search).get('author');

const map = new maplibregl.Map({
  container: 'map',
  style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: [[43.6, 36.4], [50.6, 42.4]], minZoom: 2, maxZoom: 12,
  attributionControl: { compact: true, customAttribution: '<a href="https://www.wikidata.org">Wikidata</a> · <a href="https://kitabxana.az">kitabxana.az</a>' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });

const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 16, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 48, bottom: 32, left: 23 * 16 + 48 };
map.once('load', () => {
  map.fitBounds([[43.6, 36.4], [50.6, 42.4]], { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
});
map.on('style.load', () => {
  // Quiet the base map: paper land, muted water, place names in Azerbaijani where the tiles have them
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    if (l.type === 'symbol' && l.layout?.['text-field'])
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']]);
  }
});

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelector('[data-lang-href]').href = `/qalereya/${lang === 'az' ? '' : '?lang=' + lang}`;
  document.getElementById('kx').href = kitabxana();
}
applyLang();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href);
  if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang);
  history.replaceState(null, '', u);
  applyLang();
  if (!authors.length) return;
  for (const l of map.getStyle().layers)
    if (l.type === 'symbol' && l.layout?.['text-field'] && l.source !== 'places')
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']]);
  drawHistogram(); render();
  if (focus && card.isOpen()) openCard(focus);
});

map.on('load', async () => {
  authors = await fetch('data/authors.json').then((r) => r.json());
  for (const a of authors) a.century = centuryOf(a);
  map.addSource('places', { type: 'geojson', data: empty() });
  map.addSource('paths', { type: 'geojson', data: empty() });
  map.addLayer({ id: 'paths', type: 'line', source: 'paths', paint: { 'line-color': css('--accent'), 'line-width': 1, 'line-opacity': .55 } });
  map.addLayer({ id: 'places', type: 'circle', source: 'places', paint: {
    'circle-radius': ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 1, 4, 3, 9, 9, 24],
    'circle-color': css('--accent'),
    'circle-opacity': ['case', ['get', 'dim'], .25, .8],
    'circle-stroke-color': css('--paper'), 'circle-stroke-width': ['case', ['get', 'sel'], 2.5, 1],
  } });

  map.on('mousemove', 'places', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0].properties;
    tip.setLngLat(e.features[0].geometry.coordinates).setHTML(`<strong>${esc(p.name)}</strong> · ${p.n}`).addTo(map);
  });
  map.on('mouseleave', 'places', () => { map.getCanvas().style.cursor = ''; tip.remove(); });
  map.on('click', 'places', (e) => select(e.features[0].properties.id));
  map.on('click', (e) => {
    if (map.queryRenderedFeatures(e.point, { layers: ['places'] }).length) return;
    if (card.isOpen()) card.remove(); else if (place) select(null);
  });

  const a = focus && authors.find((x) => x.slug === focus);
  if (!a) focus = null;
  else {
    mode = a.birth ? 'birth' : 'death';
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.mode === mode));
  }
  drawHistogram();
  if (a) { select(a[mode].id); openCard(a.slug); } else render();
});

function empty() { return { type: 'FeatureCollection', features: [] }; }
function visible() { return authors.filter((a) => a[mode] && (century == null || a.century === century)); }

function groups() {
  const g = new Map();
  for (const a of visible()) {
    const p = a[mode];
    if (!g.has(p.id)) g.set(p.id, { id: p.id, name: label(p), lng: p.lng, lat: p.lat, authors: [] });
    g.get(p.id).authors.push(a);
  }
  return [...g.values()].sort((x, y) => y.authors.length - x.authors.length);
}

function render() {
  const gs = groups();
  if (place && !gs.some((g) => g.id === place)) place = null;
  map.getSource('places').setData({ type: 'FeatureCollection', features: gs.map((g) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [g.lng, g.lat] },
    properties: { id: g.id, name: g.name, n: g.authors.length, sel: g.id === place, dim: place != null && g.id !== place },
  })) });
  // From a chosen place, a line to where each of its authors died (or was born)
  const other = mode === 'birth' ? 'death' : 'birth';
  const sel = gs.find((g) => g.id === place);
  map.getSource('paths').setData({ type: 'FeatureCollection', features: (sel?.authors ?? [])
    .filter((a) => a[other] && a[other].id !== place)
    .map((a) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[sel.lng, sel.lat], [a[other].lng, a[other].lat]] }, properties: { slug: a.slug } })) });
  renderList(gs, sel);
  showLine(focus);
  document.getElementById('all').hidden = century == null;
}

function renderList(gs, sel) {
  const el = document.getElementById('list');
  const n = gs.reduce((s, g) => s + g.authors.length, 0);
  if (sel) {
    const other = mode === 'birth' ? 'death' : 'birth';
    el.innerHTML = `<button type="button" class="back" id="back">← ${t('allPlaces')}</button>
      <h2>${esc(sel.name)} <small>${t('authors')(sel.authors.length)}</small></h2>
      <ol>${sel.authors.sort((a, b) => (a.born ?? a.died ?? 9999) - (b.born ?? b.died ?? 9999)).map((a) => `<li${a.slug === focus ? ' class="focus"' : ''}><button type="button" data-slug="${a.slug}" aria-pressed="${a.slug === focus}">
        <span class="name">${esc(nameOf(a))}</span>
        <span class="meta">${meta(esc(years(a)), a[other] && a[other].id !== sel.id && `${other === 'death' ? '†' : '*'} ${esc(label(a[other]))}`, origin(a))}</span></button></li>`).join('')}</ol>`;
    document.getElementById('back').onclick = () => select(null);
    el.querySelectorAll('button[data-slug]').forEach((b) => {
      b.onmouseenter = b.onfocus = () => showLine(b.dataset.slug);
      b.onmouseleave = b.onblur = () => showLine(focus);
      b.onclick = () => openCard(b.dataset.slug);
    });
    return;
  }
  el.innerHTML = `<h2>${century ? t('cent')(century) : t('allPlaces')} <small>${t('authors')(n)} · ${t('places')(gs.length)}</small></h2>
    <ol>${gs.slice(0, 60).map((g) => `<li><button type="button" data-id="${g.id}"><span class="name">${esc(g.name)}</span><span class="num">${g.authors.length}</span>
      <span class="meta">${esc(g.authors.slice(0, 3).map(nameOf).join(', '))}${g.authors.length > 3 ? '…' : ''}</span></button></li>`).join('')}</ol>
    <p class="note">${t('note')(authors.length, TOTAL)} <a href="https://github.com/azadbilik/xerite/issues">${t('wrong')}</a></p>`;
  el.querySelectorAll('button[data-id]').forEach((b) => b.onclick = () => select(b.dataset.id));
}

// Only one author's line while their row is hovered or their card is open; all of the place's otherwise
function showLine(slug) {
  if (map.getLayer('paths')) map.setFilter('paths', slug ? ['==', ['get', 'slug'], slug] : null);
}

// A card on the map for one author: years, places, works, and the way to kitabxana.az
const card = new maplibregl.Popup({ closeButton: true, closeOnClick: false, focusAfterOpen: false, className: 'card', maxWidth: '17rem', offset: 12 });
card.on('close', () => { focus = null; markFocus(); showLine(null); });
function markFocus() {
  document.querySelectorAll('#list li:has(> button[data-slug])').forEach((li) => {
    const on = li.firstElementChild.dataset.slug === focus;
    li.classList.toggle('focus', on);
    li.firstElementChild.setAttribute('aria-pressed', on);
  });
}
function openCard(slug) {
  const a = authors.find((x) => x.slug === slug);
  if (!a) return;
  focus = slug;
  markFocus();
  showLine(slug);
  const other = mode === 'birth' ? 'death' : 'birth';
  const at = a[other] && a[other].id !== place ? a[other] : a[mode];
  const where = [a.birth && `<li>* ${esc(label(a.birth))}${a.birth.from ? ` <small>${origin(a)}</small>` : ''}</li>`, a.death && `<li>† ${esc(label(a.death))}</li>`].filter(Boolean).join('');
  card.setLngLat([at.lng, at.lat]).setHTML(`<p class="card-name">${esc(nameOf(a))}</p>
    ${years(a) ? `<p class="card-years">${esc(years(a))}</p>` : ''}<ul class="card-places">${where}</ul>
    <a class="card-link" href="${kitabxana('/authors/' + a.slug)}">${t('works')(a.works)} <span aria-hidden="true">→</span></a>`).addTo(map);
  // Both ends in view when the card sits far from the chosen place
  const g = groups().find((x) => x.id === place);
  if (g && !map.getBounds().contains([at.lng, at.lat]))
    map.fitBounds([[Math.min(g.lng, at.lng), Math.min(g.lat, at.lat)], [Math.max(g.lng, at.lng), Math.max(g.lat, at.lat)]], { padding: pad(), maxZoom: map.getZoom(), duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600 });
}

function select(id) {
  if (card.isOpen()) card.remove();
  place = id;
  render();
  const g = groups().find((x) => x.id === id);
  if (g) map.easeTo({ center: [g.lng, g.lat], zoom: Math.max(map.getZoom(), 6), padding: pad(), duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600 });
  const list = document.getElementById('list');
  list.scrollTop = 0;
  list.querySelector('li.focus')?.scrollIntoView({ block: 'nearest' });
}

function drawHistogram() {
  const cs = authors.map((a) => a.century).filter(Boolean);
  const lo = Math.min(...cs), hi = Math.max(...cs);
  const range = Array.from({ length: hi - lo + 1 }, (_, i) => lo + i);
  const count = (c) => authors.filter((a) => a.century === c && a[mode]).length;
  const max = Math.max(...range.map(count));
  const hist = document.getElementById('hist');
  hist.innerHTML = range.map((c) => `<button type="button" data-c="${c}" aria-pressed="${century === c}" aria-label="${t('cent')(c)}: ${count(c)}" title="${t('cent')(c)} · ${count(c)}"><span class="bar" style="height:${Math.sqrt(count(c) / max) * 100}%"></span></button>`).join('');
  document.getElementById('axis').innerHTML = range.map((c) => `<span>${c % 2 === 0 || range.length < 9 ? roman(c) : ''}</span>`).join('');
  hist.querySelectorAll('button').forEach((b) => b.onclick = () => { const c = +b.dataset.c; century = century === c ? null : c; place = null; drawHistogram(); render(); });
}

document.getElementById('all').onclick = () => { century = null; drawHistogram(); render(); };
document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => {
  mode = b.dataset.mode; place = null;
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  drawHistogram(); render();
});
</script>
</body>
</html>
